name: Build kpimg

# Minimal builder for the patched kernel image: unlike build.yml it does not
# build the kptools/kpatch binaries or the LKM matrix, it only produces the raw
# kpimg binaries (android + linux) that APatch downloads as `kpimg-android`.
# Uses the same bare-metal toolchain as build.yml so the output is comparable.

on:
  workflow_dispatch:
  # A workflow_dispatch-only file cannot be triggered through the API/UI while
  # it lives on a non-default branch, so the build branch pushes trigger it too.
  push:
    branches:
      - ci/kpimg-build

jobs:
  kpimg:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Compiler
        run: |
          curl -sSL -o arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz

      - name: Build kpimg
        run: |
          export TARGET_COMPILE=$PWD/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-

          # The kernel only accepts a manager APK whose signing certificate DER
          # hashes to the digest compiled into it (kernel/patch/android/userd.c,
          # trusted_managers[]), and with the default superkey path gone that
          # signature check is the only way the manager is authorised.  This
          # fork ships its own APK, so its image must carry this fork's
          # certificate digest -- otherwise the manager is rejected and the app
          # reports the kernel as "not installed".
          #
          # Value = apksigner verify --print-certs <apk> "certificate SHA-256
          # digest", 32 bytes, no spaces (a C initializer).
          export CFLAGS='-DKP_TRUSTED_MANAGER_DIGEST={0x5a,0xde,0xe9,0x97,0xef,0x0e,0x5b,0x66,0xa3,0xad,0x98,0xba,0x2b,0x87,0x15,0xbd,0x8b,0xce,0xdd,0x2c,0x75,0x4c,0xd1,0x6c,0x06,0x6c,0x02,0x1e,0xc3,0x58,0xc2,0xc9}'

          cd kernel

          export ANDROID=1
          make hdr kpimg
          cp kpimg kpimg-android
          make clean

          unset ANDROID
          make hdr kpimg
          cp kpimg kpimg-linux

          sha256sum kpimg-android kpimg-linux
          ls -l kpimg-android kpimg-linux

      - name: Upload kpimg
        uses: actions/upload-artifact@v4
        with:
          name: kpimg-patched
          path: |
            kernel/kpimg-android
            kernel/kpimg-linux
